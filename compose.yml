name: boxgame
services:
  app:
    image: ${BOXGAME_IMAGE:-boxgame:local}
    build:
      context: .
      args:
        APP_REVISION: ${APP_REVISION:-local}
    container_name: boxgame
    networks:
      default: {}
      proxy:
        aliases: [boxgame]
    restart: unless-stopped
    labels:
      autoheal: "true"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 3s
      start_period: 15s
      retries: 3
    init: true
    ports:
      - "127.0.0.1:8100:3000"
    environment:
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-https://boxgame.jrhtechservices.party}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://127.0.0.1:8100,http://localhost:8100}
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-}
      TRUST_CF_CONNECTING_IP: ${TRUST_CF_CONNECTING_IP:-false}
      MAX_ROOMS: ${MAX_ROOMS:-100}
      MAX_CONNECTIONS: ${MAX_CONNECTIONS:-1000}
      CONNECTIONS_PER_NETWORK: ${CONNECTIONS_PER_NETWORK:-100}
      ROOMS_PER_NETWORK: ${ROOMS_PER_NETWORK:-5}
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    cpus: 2
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK:-aitrace_proxy}
