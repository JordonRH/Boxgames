name: boxgame-updater
services:
  updater:
    build:
      context: .
      dockerfile: deploy/updater/Dockerfile
    image: boxgame-updater:local
    container_name: boxgame-updater
    restart: unless-stopped
    labels:
      autoheal: "true"
    healthcheck:
      test: ["CMD", "python3", "-c", "import os,time; exit(0 if time.time()-os.stat('/state/heartbeat').st_mtime < 1200 else 1)"]
      interval: 60s
      timeout: 5s
      start_period: 90s
      retries: 2
    init: true
    volumes:
      - updater-state:/state
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      PUBLIC_ORIGIN: https://boxgame.jrhtechservices.party
      TRUSTED_PROXY_IPS: ""
      TRUST_CF_CONNECTING_IP: "false"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  updater-state:
